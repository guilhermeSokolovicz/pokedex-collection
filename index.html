<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeDex</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Coleção</p>
        <h1>PokeDex</h1>
      </div>
      <div class="header-actions">
        <div class="stats">
          <span id="ownedCount">0 Pokémons</span>
        </div>
        <a class="secondary-button link-button" href="./print.html" target="_blank" rel="noreferrer">Lista de faltantes</a>
      </div>
    </header>

    <main class="container">
      <section class="controls">
        <label for="generationSelect">
          Geração
          <select id="generationSelect"></select>
        </label>
        <div class="controls-actions">
          <button id="exportButton" class="secondary-button">Exportar</button>
          <button id="importButton" class="secondary-button">Importar</button>
          <a class="secondary-button link-button" href="./print.html" target="_blank" rel="noreferrer">Lista de faltantes</a>
        </div>
      </section>

      <!-- Import modal -->
      <div id="importModal" class="modal-overlay" aria-hidden="true">
        <div class="modal">
          <h3>Importar Pokémons (um número por linha)</h3>
          <textarea id="importTextarea" rows="10" placeholder="Exemplo:\n1\n4\n7"></textarea>
          <div class="modal-actions">
            <button id="doImport" class="secondary-button">Importar</button>
            <button id="closeImport" class="secondary-button">Fechar</button>
          </div>
        </div>
      </div>

      <section id="pokemonList" class="pokemon-grid" aria-live="polite"></section>

      <nav class="pagination" aria-label="Paginação dos pokémons">
        <button id="prevButton" type="button">Anterior</button>
        <span id="pageLabel">Página 1</span>
        <button id="nextButton" type="button">Próxima</button>
      </nav>
    </main>

    <template id="pokemonCardTemplate">
      <article class="pokemon-card">
        <label class="pokemon-check">
          <input type="checkbox" />
          <span>Tenho</span>
        </label>
        <img alt="" class="pokemon-image" />
        <div class="pokemon-info">
          <span class="pokemon-number"></span>
          <h2 class="pokemon-name"></h2>
        </div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
